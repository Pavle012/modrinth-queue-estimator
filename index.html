<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modrinth Queue Estimator</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-[#0b0b0e]">
    
    <div id="root"></div>

    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

    <script>
    const { useState, useEffect, useMemo } = React;

    const API_BASE = "https://api.modrinth.com/v2";

    const App = () => {
      const [view, setView] = useState('setup'); 
      const [apiKey, setApiKey] = useState('');
      const [userProjects, setUserProjects] = useState([]);
      const [selectedProject, setSelectedProject] = useState(null);
      const [selectedProjectType, setSelectedProjectType] = useState(null);
      
      const [queueStats, setQueueStats] = useState(null);
      const [userProjectStats, setUserProjectStats] = useState(null);
      const [loading, setLoading] = useState(false);
      const [loadingProjects, setLoadingProjects] = useState(false);
      const [loadingAnalysis, setLoadingAnalysis] = useState(false);
      const [error, setError] = useState(null);

      const fetchUserProjects = async () => {
        if (!apiKey.trim()) {
          setError("Please enter a valid API key");
          return;
        }

        setLoadingProjects(true);
        setError(null);
        try {
          const userRes = await fetch(`${API_BASE}/user`, {
            headers: { 'Authorization': apiKey }
          });

          if (!userRes.ok) {
            if (userRes.status === 401) {
              throw new Error("Invalid API key. Please check your credentials.");
            }
            throw new Error("Failed to fetch user info");
          }

          const userData = await userRes.json();
          const userId = userData.id;

          const response = await fetch(`${API_BASE}/user/${userId}/projects`, {
            headers: { 'Authorization': apiKey }
          });

          if (!response.ok) {
            throw new Error("Failed to fetch projects");
          }

          const data = await response.json();
          const pendingProjects = data.filter(p => p.status === 'processing' || p.status === 'under_review');
          
          if (pendingProjects.length === 0) {
            setError("No pending projects found. All your projects have been approved!");
            setUserProjects([]);
          } else {
            setUserProjects(pendingProjects);
            setSelectedProject(pendingProjects[0]);
            setError(null);
          }
        } catch (err) {
          setError(err.message || "Failed to fetch user projects. Check your API key and try again.");
          setUserProjects([]);
        } finally {
          setLoadingProjects(false);
        }
      };

      const analyzeSelectedProject = async () => {
        if (!selectedProject) {
          setError("Please select a project");
          return;
        }

        setLoadingAnalysis(true);
        setError(null);
        try {
          const projectType = selectedProject.project_type;
          setSelectedProjectType(projectType);

          // Get full project details to access queue submission info
          const selectedProjectDetailRes = await fetch(`${API_BASE}/project/${selectedProject.id}`);
          const selectedProjectDetail = await selectedProjectDetailRes.json();
          
          // Fetch queue stats for this project type
          const searchRes = await fetch(`${API_BASE}/search?limit=50&index=newest&facets=[["project_type:${projectType}"]]`);
          if (!searchRes.ok) throw new Error("Search API failed");
          const searchData = await searchRes.json();

          const details = await Promise.all(searchData.hits.map(async (hit) => {
            try {
              const pRes = await fetch(`${API_BASE}/project/${hit.project_id}`);
              const pData = pRes.ok ? await pRes.json() : { published: hit.date_created };
              return {
                id: hit.project_id,
                title: hit.title,
                queued: new Date(pData.published),
                approved: new Date(hit.date_created)
              };
            } catch {
              return {
                id: hit.project_id,
                title: hit.title,
                queued: new Date(hit.date_created),
                approved: new Date(hit.date_created)
              };
            }
          }));

          const sortedProjects = details.sort((a, b) => b.queued - a.queued);

          if (sortedProjects.length < 2) {
            throw new Error("Not enough data to calculate statistics");
          }

          const waits = sortedProjects.map(p => p.approved.getTime() - p.queued.getTime()).sort((a, b) => a - b);
          const medianWaitMillis = waits[Math.floor(waits.length / 2)];
          const avgWaitDays = medianWaitMillis / (1000 * 60 * 60 * 24);

          const currentQueueFront = new Date(Date.now() - medianWaitMillis);
          
          // For pending projects, use the requested_status_change date (queue submission)
          let userQueuedDate;
          if (selectedProjectDetail.requested_status && selectedProjectDetail.requested_status.requested_by) {
            // Use the date the status change was requested
            userQueuedDate = new Date(selectedProjectDetail.status_updates?.[0]?.created || selectedProject.date_updated || selectedProject.published);
          } else {
            // Fallback to updated date or published
            userQueuedDate = new Date(selectedProject.date_updated || selectedProject.published);
          }

          const gapMillis = userQueuedDate.getTime() - currentQueueFront.getTime();
          const gapDays = gapMillis / (1000 * 60 * 60 * 24);
          const estimatedApproval = new Date(userQueuedDate.getTime() + medianWaitMillis);

          setQueueStats({
            avgWaitDays,
            currentQueueFront,
            allProjects: sortedProjects
          });

          setUserProjectStats({
            gapDays,
            estimatedApproval,
            isPassed: gapDays <= 0,
            queuedDate: userQueuedDate
          });

          setView('dashboard');
        } catch (err) {
          setError(err.message || "Failed to analyze project. Try again.");
        } finally {
          setLoadingAnalysis(false);
        }
      };

      if (view === 'setup') {
        return React.createElement('div', { className: "min-h-screen bg-[#0b0b0e] text-slate-300 flex items-center justify-center p-6 font-sans" },
          React.createElement('div', { className: "max-w-2xl w-full bg-slate-900 border border-slate-800 rounded-3xl p-8 shadow-2xl" },
            React.createElement('div', { className: "flex items-center gap-3 mb-8 justify-center" },
              React.createElement('h1', { className: "text-3xl font-black text-white tracking-tighter" },
                "Queue",
                React.createElement('span', { className: "text-blue-500" }, "Estimator")
              )
            ),
            React.createElement('div', { className: "space-y-6" },
              React.createElement('div', null,
                React.createElement('label', { className: "block text-xs font-bold uppercase tracking-wider text-slate-400 mb-2" }, "Modrinth API Key"),
                React.createElement('input', {
                  type: "password",
                  value: apiKey,
                  onChange: (e) => setApiKey(e.target.value),
                  onKeyPress: (e) => e.key === 'Enter' && fetchUserProjects(),
                  placeholder: "Paste your Modrinth API key here",
                  className: "w-full bg-slate-950 border border-slate-800 rounded-xl p-4 text-white focus:outline-none focus:border-blue-500 transition-colors text-sm"
                })
              ),
              React.createElement('p', { className: "text-xs text-slate-500" }, "Get your API key from your Modrinth account settings. Your key stays private and is never stored."),
              React.createElement('button', {
                onClick: fetchUserProjects,
                disabled: loadingProjects || !apiKey.trim(),
                className: "w-full bg-blue-600 hover:bg-blue-500 disabled:bg-blue-900 disabled:opacity-50 text-white px-4 py-3 rounded-lg font-bold flex items-center justify-center gap-2 text-sm transition-colors"
              }, loadingProjects ? "Loading projects..." : "Load My Pending Projects"),
              
              userProjects.length > 0 && React.createElement('div', { className: "border-t border-slate-700 pt-6" },
                React.createElement('label', { className: "block text-xs font-bold uppercase tracking-wider text-slate-400 mb-3" }, "Select a Project to Analyze"),
                React.createElement('div', { className: "space-y-2 max-h-96 overflow-y-auto" },
                  userProjects.map(project =>
                    React.createElement('button', {
                      key: project.id,
                      onClick: () => setSelectedProject(project),
                      className: `w-full text-left p-4 rounded-xl border transition-all ${selectedProject?.id === project.id ? 'bg-blue-600/20 border-blue-500' : 'bg-slate-950 border-slate-800 hover:border-slate-700'}`
                    },
                      React.createElement('div', { className: "font-bold text-white text-sm truncate" }, project.title),
                      React.createElement('div', { className: "text-xs text-slate-400 mt-2 space-y-1" },
                        React.createElement('div', null, `Type: ${project.project_type.charAt(0).toUpperCase() + project.project_type.slice(1)}`),
                        React.createElement('div', null, `Queued: ${new Date(project.date_updated || project.published).toLocaleString()}`),
                        React.createElement('div', { className: "text-slate-500" }, `Status: ${project.status}`)
                      )
                    )
                  )
                ),
                React.createElement('button', {
                  onClick: analyzeSelectedProject,
                  disabled: !selectedProject || loadingAnalysis,
                  className: "w-full mt-4 bg-emerald-600 hover:bg-emerald-500 disabled:bg-emerald-900 disabled:opacity-50 text-white py-3 rounded-xl font-black flex items-center justify-center gap-2 transition-all shadow-lg shadow-emerald-900/20"
                }, loadingAnalysis ? "Analyzing..." : "📊 Analyze Selected Project")
              ),

              error && React.createElement('div', { className: "bg-rose-500/10 border border-rose-500/20 text-rose-400 p-3 rounded-xl flex items-center gap-2 text-sm" }, 
                "⚠",
                error
              )
            )
          )
        );
      }

      return React.createElement('div', { className: "min-h-screen bg-[#0b0b0e] text-slate-300 p-4 md:p-8 font-sans" },
        React.createElement('div', { className: "max-w-5xl mx-auto space-y-6" },
          React.createElement('header', { className: "flex flex-wrap items-center justify-between gap-4 bg-slate-900 border border-slate-800 rounded-2xl p-4" },
            React.createElement('div', { className: "flex items-center gap-4" },
              React.createElement('button', { onClick: () => { setView('setup'); setSelectedProject(null); setQueueStats(null); setUserProjectStats(null); }, className: "p-2 hover:bg-slate-800 rounded-lg text-slate-400 transition-colors" }, "↶ Back"),
              React.createElement('div', null,
                React.createElement('h1', { className: "text-xl font-black text-white flex items-center gap-2" },
                  selectedProject?.title,
                  React.createElement('span', { className: "text-blue-500 text-lg" }, "Analysis")
                ),
                React.createElement('p', { className: "text-xs text-slate-400 mt-1" },
                  `${selectedProjectType?.charAt(0).toUpperCase() + selectedProjectType?.slice(1) || 'Project'} • Queued ${userProjectStats?.queuedDate?.toLocaleDateString()}`
                )
              )
            )
          ),
          error && React.createElement('div', { className: "bg-rose-500/10 border border-rose-500/20 text-rose-400 p-4 rounded-xl flex items-center gap-3" }, "⚠", error),
          loading && !queueStats ? React.createElement('div', { className: "text-center py-20 animate-pulse text-slate-500 font-bold tracking-widest uppercase" }, "Crunching Modrinth API...") : queueStats && userProjectStats ? React.createElement(React.Fragment, null,
            React.createElement('div', { className: "grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6" },
              React.createElement('div', { className: "bg-slate-900 border border-slate-800 rounded-3xl p-6 relative overflow-hidden" },
                React.createElement('div', { className: "absolute inset-0 bg-gradient-to-br from-blue-500/10 to-transparent opacity-30" }),
                React.createElement('p', { className: "text-[10px] font-black uppercase tracking-widest text-slate-500 mb-2 relative z-10" }, "Avg Queue Time"),
                React.createElement('div', { className: "text-5xl font-black text-white relative z-10" },
                  queueStats.avgWaitDays.toFixed(1),
                  React.createElement('span', { className: "text-lg text-slate-500 ml-1" }, "days")
                ),
                React.createElement('p', { className: "text-xs text-slate-400 mt-2 relative z-10" }, "Median wait from submission to approval")
              ),
              React.createElement('div', { className: "bg-slate-900 border border-slate-800 rounded-3xl p-6 relative overflow-hidden" },
                React.createElement('div', { className: "absolute inset-0 bg-gradient-to-br from-purple-500/10 to-transparent opacity-30" }),
                React.createElement('p', { className: "text-[10px] font-black uppercase tracking-widest text-slate-500 mb-2 relative z-10" }, "Queue Position"),
                React.createElement('div', { className: "text-5xl font-black text-white relative z-10" },
                  userProjectStats.gapDays.toFixed(1),
                  React.createElement('span', { className: "text-lg text-slate-500 ml-1" }, "days")
                ),
                React.createElement('p', { className: "text-xs text-slate-400 mt-2 relative z-10" }, userProjectStats.gapDays <= 0 ? "Already past queue front!" : "Behind queue front")
              ),
              React.createElement('div', { className: `bg-slate-900 border rounded-3xl p-6 relative overflow-hidden ${userProjectStats.isPassed ? 'border-emerald-500/30 bg-gradient-to-br from-emerald-500/5 to-transparent' : 'border-orange-500/30 bg-gradient-to-br from-orange-500/5 to-transparent'}`},
                React.createElement('p', { className: "text-[10px] font-black uppercase tracking-widest text-slate-500 mb-2 relative z-10" }, "Estimated Approval"),
                userProjectStats.isPassed ? React.createElement('div', null,
                  React.createElement('div', { className: "text-3xl font-black text-emerald-400 leading-tight relative z-10" }, "🎉 Any Minute!"),
                  React.createElement('p', { className: "text-xs text-slate-400 mt-2 relative z-10" }, "The queue front has passed your submission!")
                ) : React.createElement('div', null,
                  React.createElement('div', { className: "text-3xl font-black text-orange-400 leading-tight relative z-10" }, userProjectStats.estimatedApproval.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' })),
                  React.createElement('p', { className: "text-xs text-slate-400 mt-2 relative z-10" }, `Approximately ${userProjectStats.gapDays.toFixed(1)} days away`)
                )
              )
            ),
            React.createElement('div', { className: "bg-slate-900 border border-slate-800 rounded-3xl p-6" },
              React.createElement('h2', { className: "text-xs font-black uppercase tracking-widest text-slate-500 mb-4 border-b border-slate-800 pb-4" }, `Latest Approved Projects (${selectedProjectType?.charAt(0).toUpperCase() + selectedProjectType?.slice(1)})`),
              React.createElement('div', { className: "grid grid-cols-1 md:grid-cols-2 gap-3" },
                queueStats.allProjects.slice(0, 20).map((p, idx) => 
                  React.createElement('div', { key: idx, className: "bg-slate-950 border border-slate-800 p-4 rounded-xl flex justify-between items-center hover:border-slate-700 transition-colors" },
                    React.createElement('div', { className: "min-w-0 pr-4" },
                      React.createElement('h4', { className: "text-sm font-bold text-white truncate" }, p.title),
                      React.createElement('div', { className: "text-[10px] text-slate-500 font-mono mt-1" },
                        `${p.queued.toLocaleDateString()} → ${p.approved.toLocaleDateString()}`
                      )
                    ),
                    React.createElement('div', { className: "text-right shrink-0 bg-slate-900 px-3 py-1.5 rounded-lg border border-slate-800" },
                      React.createElement('div', { className: "text-xs font-black text-emerald-400" }, `${((p.approved - p.queued) / (1000 * 60 * 60 * 24)).toFixed(1)}d`),
                      React.createElement('div', { className: "text-[8px] uppercase font-bold text-slate-500" }, "Wait")
                    )
                  )
                )
              )
            )
          ) : null
        )
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(React.createElement(App));
    </script>
</body>
</html>
